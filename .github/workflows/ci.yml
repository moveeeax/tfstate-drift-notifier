name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version: ['1.26', '1.27']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race -coverprofile=coverage.out ./...
      - name: Build
        run: go build -o tfstate-drift-notifier ./cmd/tfstate-drift-notifier
      - name: Smoke test (drift fixture exits 2)
        run: |
          set +e
          ./tfstate-drift-notifier --plan-file testdata/drift.jsonl
          code=$?
          set -e
          test "$code" -eq 2 || { echo "expected exit 2 on drift, got $code"; exit 1; }
          ./tfstate-drift-notifier --plan-file testdata/clean.jsonl
